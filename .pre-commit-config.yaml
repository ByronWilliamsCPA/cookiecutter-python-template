# Pre-commit hooks for the cookiecutter template repository itself
# This validates the template files before committing changes
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '{{cookiecutter.project_slug}}'  # Exclude template files with jinja2
      - id: check-json
        files: ^cookiecutter\.json$
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: 'tests/test_zero_issues\.py'  # Contains key pattern strings as regex literals for security testing
      - id: check-toml
        exclude: '{{cookiecutter.project_slug}}'  # Exclude template files with jinja2
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: >-
          (?x)^(
            uv\.lock|
            \.secrets\.baseline|
            {{cookiecutter\.project_slug}}/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff-format
        files: ^hooks/.*\.py$
      - id: ruff
        files: ^hooks/.*\.py$
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright type check
        entry: basedpyright
        language: system
        types: [python]
        files: ^hooks/.*\.py$
        pass_filenames: false

      - id: validate-hook-files
        name: Validate Python hook files
        entry: python3 -m py_compile
        language: system
        files: ^hooks/.*\.py$
        pass_filenames: true

      - id: test-template-generation
        name: Test cookiecutter template generation
        entry: >
          bash -c 'if command -v cookiecutter &> /dev/null; then
          cookiecutter . --no-input --output-dir /tmp/test-template &&
          rm -rf /tmp/test-template; else
          echo "Skipping: cookiecutter not installed"; fi'
        language: system
        pass_filenames: false
        stages: [manual]  # Run manually with: pre-commit run test-template-generation --hook-stage manual

      - id: check-hardcoded-values
        name: Check for hardcoded usernames/repos
        entry: >
          bash -c 'if [ -d "{{cookiecutter.project_slug}}" ] && grep -r "williaby\|PromptCraft"
          --include="*.md" --include="*.py" --include="*.sh"
          --exclude-dir=".claude" --exclude-dir="scripts" --exclude="README.md"
          "{{cookiecutter.project_slug}}"; then
          echo "ERROR: Found hardcoded values that should be templated"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: check-template-syntax
        name: Check Jinja2 template syntax
        entry: >
          bash -c 'find {{cookiecutter.project_slug}} -type f
          \( -name "*.py" -o -name "*.toml" -o -name "*.yaml" -o -name "*.yml" -o -name "*.md" \)
          -exec sh -c '\''grep -l "{{" "$1" > /dev/null && echo "Checking: $1"'\'' _ {} \;'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: pip-audit
        name: pip-audit dependency scan
        entry: pip-audit
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: no-em-dash
        name: No em-dashes
        language: pygrep
        entry: "—"
        files: \.(py|md|txt|toml|yaml|yml|json|rst)$
        types_or: [python, markdown, plain-text]

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ['-v', '--fail-under=85', 'hooks/']
        pass_filenames: false

  - repo: local
    hooks:
      - id: darglint
        name: darglint docstring validation
        entry: darglint
        language: system
        types: [python]
        files: ^hooks/.*\.py$
        exclude: ^tests/|^scripts/|^benchmarks/|^tools/
        args: ['--strictness', 'long', '--docstring-style', 'google']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
        exclude: '{{cookiecutter\.project_slug}}'  # Template files contain Jinja2 syntax
        args: [--severity=warning]

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: script-must-have-extension
        name: Shell scripts must have .sh extension
        files: ^.*\.sh$
        types: [shell]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        exclude: '(docs-reference/|\.git/)'
        args:
          - --ignore-words-list=crate,nd,rouge,compiletime,intoto,ure

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint']
        exclude: '{{cookiecutter.project_slug}}'  # Exclude template files with jinja2

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD029', 'MD033', 'MD041']
