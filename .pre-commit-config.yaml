# Pre-commit hooks for the cookiecutter template repository itself
# This validates the template files before committing changes
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '{{cookiecutter.project_slug}}'  # Exclude template files with jinja2
      - id: check-json
        files: ^cookiecutter\.json$
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: 'tests/test_zero_issues\.py'  # Contains key pattern strings as regex literals for security testing
      - id: check-toml
        exclude: '{{cookiecutter.project_slug}}'  # Exclude template files with jinja2
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Do NOT exclude {{cookiecutter.project_slug}} here. The new
        # .secrets.baseline already suppresses current false positives;
        # excluding the entire template tree means real secrets added
        # under the generated project would never be detected.
        exclude: >-
          (?x)^(
            uv\.lock|
            \.secrets\.baseline
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: fa1ed65ba95bfa7771a71003a9d74402541f5a5c  # v0.14.6
    hooks:
      - id: ruff-format
        files: ^hooks/.*\.py$
      - id: ruff
        files: ^hooks/.*\.py$
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright type check
        entry: basedpyright
        language: system
        types: [python]
        files: ^hooks/.*\.py$
        pass_filenames: false

      - id: validate-hook-files
        name: Validate Python hook files
        entry: python3 -m py_compile
        language: system
        files: ^hooks/.*\.py$
        pass_filenames: true

      - id: test-template-generation
        name: Test cookiecutter template generation
        entry: >
          bash -c 'if command -v cookiecutter &> /dev/null; then
          cookiecutter . --no-input --output-dir /tmp/test-template &&
          rm -rf /tmp/test-template; else
          echo "Skipping: cookiecutter not installed"; fi'
        language: system
        pass_filenames: false
        stages: [manual]  # Run manually with: pre-commit run test-template-generation --hook-stage manual

      - id: check-hardcoded-values
        name: Check for hardcoded usernames/repos
        # Hardcoded-value check runs across the entire generated template
        # tree, including README.md and scripts/. Excluding them previously
        # let williaby / PromptCraft references leak into user-facing docs
        # and executable scripts. .claude/ remains excluded because it
        # legitimately tracks the template author's settings repo.
        entry: >
          bash -c 'if [ -d "{{cookiecutter.project_slug}}" ] && grep -r "williaby\|PromptCraft"
          --include="*.md" --include="*.py" --include="*.sh"
          --exclude-dir=".claude"
          "{{cookiecutter.project_slug}}"; then
          echo "ERROR: Found hardcoded values that should be templated"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: check-template-syntax
        name: Check Jinja2 template syntax
        entry: >
          bash -c 'find {{cookiecutter.project_slug}} -type f
          \( -name "*.py" -o -name "*.toml" -o -name "*.yaml" -o -name "*.yml" -o -name "*.md" \)
          -exec sh -c '\''grep -l "{{" "$1" > /dev/null && echo "Checking: $1"'\'' _ {} \;'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: pip-audit
        name: pip-audit dependency scan
        entry: pip-audit
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: no-em-dash
        name: No em-dashes
        language: pygrep
        entry: "—"
        files: \.(py|md|txt|toml|yaml|yml|json|rst|sh|bash)$
        types_or: [python, markdown, plain-text, toml, yaml, json, rst, shell]
        exclude: ^\.pre-commit-config\.yaml$

  - repo: https://github.com/econchick/interrogate
    rev: a6268877efd41a21197445cc04cbf28f9c6facba  # 1.7.0
    hooks:
      - id: interrogate
        args: ['-v', '--fail-under=85', 'hooks/']
        pass_filenames: false

  - repo: local
    hooks:
      - id: darglint
        name: darglint docstring validation
        entry: darglint
        language: system
        types: [python]
        files: ^hooks/.*\.py$
        exclude: ^tests/|^scripts/|^benchmarks/|^tools/
        args: ['--strictness', 'long', '--docstring-style', 'google']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 4de1378e4cd853bfc2b111b05fff35e2dbf809a3  # v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
        exclude: '{{cookiecutter\.project_slug}}'  # Template files contain Jinja2 syntax
        args: [--severity=warning]

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 38980559e3a605691d6579f96222c30778e5a69e  # 3.0.0
    hooks:
      - id: script-must-have-extension
        name: Shell scripts must have .sh extension
        files: ^.*\.sh$
        types: [shell]

  - repo: https://github.com/codespell-project/codespell
    rev: 6e41aba91fb32e9feb741a6258eefeb9c6e4a482  # v2.2.6
    hooks:
      - id: codespell
        exclude: '(docs-reference/|\.git/)'
        args:
          - --ignore-words-list=crate,nd,rouge,compiletime,intoto,ure

  - repo: https://github.com/adrienverge/yamllint
    rev: 8713140e99914c0cb6e07364daedfb140847c3c5  # v1.33.0
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint']
        exclude: '{{cookiecutter.project_slug}}'  # Exclude template files with jinja2

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 1d2f2483dbca436b5e89d208f1ff56688ba4af9e  # v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD029', 'MD033', 'MD041']

  # ============================================================================
  # Secret Detection - TruffleHog
  # ============================================================================
  # Advanced secret detection beyond detect-private-key.
  # Binary is managed by pre-commit's golang env (declared upstream),
  # so no system-level install is required; pinned via SHA for security.
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: 37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3
    hooks:
      - id: trufflehog
        name: TruffleHog Secret Scanner (staged files)
        description: Detect secrets in staged files before committing
        # Override upstream's default git-history scan. Pre-commit hook scope is
        # staged files only; full git-history scanning belongs in CI to avoid
        # false positives from local-only branches in the object store.
        entry: bash -c 'git diff --cached -z --diff-filter=d --name-only 2>/dev/null | xargs -0 -r trufflehog filesystem --fail --no-update --results=verified,unknown'
        pass_filenames: false
        stages: [pre-commit]
