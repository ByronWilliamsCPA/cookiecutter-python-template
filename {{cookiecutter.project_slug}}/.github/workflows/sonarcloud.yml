{% if cookiecutter.include_sonarcloud == "yes" -%}
# {{ cookiecutter.project_name }} - SonarCloud Analysis
# Thin caller for the organization's reusable SonarCloud workflow.
#
# The reusable workflow uses sonarqube-scan-action v7.2.0, which resolves
# the /analysis/analyses 404 bug encountered with v4.x on new projects.
#
# SonarCloud Dashboard: https://sonarcloud.io/dashboard?id={{ cookiecutter.github_org_or_user }}_{{ cookiecutter.project_slug }}
#
# Note: This workflow requires SONAR_TOKEN secret to be configured.
# If not configured, the reusable workflow will skip gracefully.
name: SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    permissions:
      contents: read
      pull-requests: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@62bfd795d1273b4819a3f66aa9cef0b917acb830  # main
    with:
      sonar-organization: '{{ cookiecutter.sonarcloud_organization }}'
      sonar-project-key: '{{ cookiecutter.github_org_or_user }}_{{ cookiecutter.project_slug }}'
      python-version: '{{ cookiecutter.python_version }}'
      source-directory: 'src'
      coverage-paths: 'coverage.xml'
      fail-on-quality-gate: {% raw %}${{ github.event_name != 'pull_request' }}{% endraw %}
      skip-if-no-token: true
      no-build: false  # generated project ships as an installable package; upstream default of true would block 'uv sync' from installing the editable project for coverage
    secrets:
      SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
{% endif -%}
