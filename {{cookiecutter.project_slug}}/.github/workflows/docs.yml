# Documentation Workflow
# Builds and deploys MkDocs documentation to GitHub Pages.
#
# Features:
#   - MkDocs Material theme build
#   - GitHub Pages deployment on push to main
#   - PR preview builds
{% if cookiecutter.use_mkdocs == "yes" and cookiecutter.include_github_actions == "yes" -%}
name: Documentation

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write  # For GitHub Pages deployment
  pages: write
  id-token: write

{% if cookiecutter.use_org_workflows == "yes" -%}
# Uses org-level reusable workflow
jobs:
  docs:
    name: Build & Deploy Docs
    uses: {{ cookiecutter.github_org_or_user }}/.github/.github/workflows/python-docs.yml@main
    with:
      python-version: '{{ cookiecutter.python_version }}'
      deploy-to-pages: >-
        {% raw %}${{
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        }}{% endraw %}
{% else -%}
# Standalone documentation workflow
jobs:
  docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    # `mkdocs gh-deploy --force` pushes directly to the gh-pages branch and
    # only needs `contents: write`. Pages API / OIDC scopes are not exercised
    # here (those would be required only if switching to actions/deploy-pages).
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install {{ cookiecutter.python_version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: {% raw %}${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}{% endraw %}
        run: uv run mkdocs gh-deploy --force
{% endif -%}
{% endif -%}
