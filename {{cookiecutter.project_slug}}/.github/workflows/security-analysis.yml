---
# Security Analysis Workflow
# Runs security scans including Bandit and dependency checks.
#
# Features:
#   - Bandit static analysis for Python
#   - OSV-Scanner dependency vulnerability scanning
#   - Weekly scheduled scans
{% if cookiecutter.include_github_actions == "yes" -%}
name: Security Analysis

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}{% endraw %}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

{% if cookiecutter.use_org_workflows == "yes" -%}
# Uses org-level reusable workflow
jobs:
  security:
    name: Security Scan
    uses: {{ cookiecutter.github_org_or_user }}/.github/.github/workflows/python-security-analysis.yml@main
    with:
      source-directory: 'src'
      python-version: '{{ cookiecutter.python_version }}'
      fail-on-high: true
      fail-on-medium: false
      run-codeql: true
      run-dependency-review: true
      run-bandit: true
      run-osv: true

  security-gate-success:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    steps:
      - name: Check security scan results
        run: |
          if [ "{% raw %}${{ needs.security.result }}{% endraw %}" == "success" ]; then
            echo "Security Gate passed"
          else
            echo "Security Gate failed: {% raw %}${{ needs.security.result }}{% endraw %}"
            exit 1
          fi
{%- else -%}
# Standalone security workflow
jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install {{ cookiecutter.python_version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Bandit security scan
        run: uv run bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true

      - name: Run OSV-Scanner dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output=osv-scanner-report.json
            --format=json
            --recursive
            ./
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            bandit-report.json
            osv-scanner-report.json
          retention-days: 30

  security-gate-success:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    steps:
      - name: Check security scan results
        run: |
          if [ "{% raw %}${{ needs.security.result }}{% endraw %}" == "success" ]; then
            echo "Security Gate passed"
          else
            echo "Security Gate failed: {% raw %}${{ needs.security.result }}{% endraw %}"
            exit 1
          fi
{%- endif -%}
{%- endif -%}
