---
# OpenSSF Scorecard for {{ cookiecutter.project_name }}
# Security posture assessment and supply chain security validation.
#
# Dashboard: https://securityscorecards.dev/viewer/?uri=github.com/{{ cookiecutter.github_org_or_user }}/{{ cookiecutter.project_slug }}
# Documentation: https://github.com/ossf/scorecard
{%- if cookiecutter.include_github_actions == "yes" %}
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesdays at 21:21 UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

{% if cookiecutter.use_org_workflows == "yes" -%}
# Uses org-level reusable workflow
jobs:
  scorecard:
    name: Scorecard Analysis
    uses: {{ cookiecutter.github_org_or_user }}/.github/.github/workflows/python-scorecard.yml@main
    with:
      # GitHub Advanced Security (Code Security) requires a paid plan and is
      # not assumed to be enabled on projects generated from this template.
      # The reusable workflow's "Upload Scorecard artifact" step runs
      # unconditionally, so results remain reviewable as a build artifact.
      upload-sarif: false
      artifact-retention-days: 5
{%- else -%}
# Standalone OpenSSF Scorecard workflow
jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # `publish_results` is the scorecard-action's own (still-valid)
          # parameter that enables publishing to the OpenSSF dashboard.
          # Distinct from the deprecated `publish-results` reusable-workflow
          # input (hyphen) removed from the org-workflow caller above.
          publish_results: true

      # GitHub Advanced Security (Code Security) requires a paid plan and is
      # not assumed to be enabled on projects generated from this template,
      # so github/codeql-action/upload-sarif has no destination to post to.
      # The artifact upload immediately below already publishes the same
      # results.sarif file, so no separate SARIF upload step is needed.
      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
{% endif -%}
{%- else %}
# GitHub Actions disabled for this project
# Enable include_github_actions to use OpenSSF Scorecard
{%- endif %}
