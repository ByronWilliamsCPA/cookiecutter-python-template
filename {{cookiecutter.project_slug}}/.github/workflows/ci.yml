# CI/CD Pipeline
# Runs tests, linting, type checking, and security scans.
#
# Features:
#   - Standard quality checks (tests, linting, type checking)
#   - Security scanning (Bandit)
#   - Optional SonarCloud/Codecov integration
{% if cookiecutter.include_github_actions == "yes" -%}
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}{% endraw %}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

{% if cookiecutter.use_org_workflows == "yes" -%}
# Uses org-level reusable workflow
jobs:
  ci:
    name: CI Pipeline
    uses: {{ cookiecutter.github_org_or_user }}/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: '{{ cookiecutter.python_version }}'
      coverage-threshold: {{ cookiecutter.code_coverage_target }}
      source-directory: 'src'
      test-directory: 'tests'
      {%- if cookiecutter.include_sonarcloud == "yes" %}
      enable-sonarcloud: true
      sonarcloud-organization: '{{ cookiecutter.github_org_or_user }}'
      sonarcloud-project-key: '{{ cookiecutter.github_org_or_user }}_{{ cookiecutter.project_slug }}'
      {%- else %}
      enable-sonarcloud: false
      {%- endif %}
      {%- if cookiecutter.include_codecov == "yes" %}
      enable-codecov: true
      {%- else %}
      enable-codecov: false
      {%- endif %}
      run-integration-tests: true
      run-security-tests: true
      fail-on-llm-tags: false
    secrets:
      {%- if cookiecutter.include_sonarcloud == "yes" %}
      SONAR_TOKEN: {% raw %}${{ secrets.SONAR_TOKEN }}{% endraw %}
      {%- endif %}
      {%- if cookiecutter.include_codecov == "yes" %}
      CODECOV_TOKEN: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
      {%- endif %}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check CI results
        run: |
          if [ "{% raw %}${{ needs.ci.result }}{% endraw %}" != "success" ]; then
            echo "CI Gate failed"
            exit 1
          fi
          echo "CI Gate passed"
{% else -%}
# Standalone CI workflow
{% if cookiecutter.include_supply_chain_security == "yes" -%}
env:
  INFISICAL_DOMAIN: {{ cookiecutter.infisical_domain }}
{% endif -%}

jobs:
  test:
    name: Test (Python {{ cookiecutter.python_version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      {%- if cookiecutter.include_supply_chain_security == "yes" %}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          client-id: {% raw %}${{ secrets.INFISICAL_CLIENT_ID }}{% endraw %}
          client-secret: {% raw %}${{ secrets.INFISICAL_CLIENT_SECRET }}{% endraw %}
          env-slug: {% raw %}${{ github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/develop' && 'staging' || 'dev' }}{% endraw %}
          project-slug: {{ cookiecutter.project_slug }}
          domain: {% raw %}${{ env.INFISICAL_DOMAIN }}{% endraw %}

      - name: Authenticate to GCP (for Artifact Registry)
        if: env.GCP_SA_KEY_BASE64 != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: {% raw %}${{ env.GCP_SA_KEY_BASE64 }}{% endraw %}
      {%- endif %}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install {{ cookiecutter.python_version }}

      {%- if cookiecutter.include_supply_chain_security == "yes" %}

      - name: Install keyring for Artifact Registry
        run: pip install keyrings.google-artifactregistry-auth
      {%- endif %}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest -v \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under={{ cookiecutter.code_coverage_target }} \
            --junitxml=junit.xml \
            -o junit_family=xunit2

      - name: Run type checker
        run: uv run basedpyright src/

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run security scan (Bandit)
        run: uv run bandit -r src/ -c pyproject.toml

      {%- if cookiecutter.include_codecov == "yes" %}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
          files: ./coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload test analytics to Codecov
        if: always()
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
          files: ./junit.xml
          flags: unit
          report_type: test_results
          fail_ci_if_error: false
      {%- endif %}

{% if cookiecutter.include_frontend == "react" -%}
  frontend:
    name: Frontend (Node {{ cookiecutter.node_version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '{{ cookiecutter.node_version }}'
          cache: '{{ cookiecutter.frontend_package_manager }}'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: {{ cookiecutter.frontend_package_manager }} ci

      - name: Lint
        run: {{ cookiecutter.frontend_package_manager }} run lint

      - name: Type check
        run: {{ cookiecutter.frontend_package_manager }} run typecheck

      - name: Test
        run: {{ cookiecutter.frontend_package_manager }} run test:run -- --coverage

      - name: Build
        run: {{ cookiecutter.frontend_package_manager }} run build

      - name: Upload frontend coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
{% endif -%}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test{% if cookiecutter.include_frontend == "react" %}, frontend{% endif %}]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check CI results
        env:
          TEST_RESULT: {% raw %}${{ needs.test.result }}{% endraw %}
{%- if cookiecutter.include_frontend == "react" %}
          FRONTEND_RESULT: {% raw %}${{ needs.frontend.result }}{% endraw %}
{%- endif %}
        run: |
          FAILED=false
          [ "$TEST_RESULT" != "success" ] && FAILED=true
{%- if cookiecutter.include_frontend == "react" %}
          [ "$FRONTEND_RESULT" != "success" ] && FAILED=true
{%- endif %}
          if [ "$FAILED" = "true" ]; then
            echo "CI Gate failed"
            exit 1
          fi
          echo "CI Gate passed"
{% endif -%}
{% endif -%}
