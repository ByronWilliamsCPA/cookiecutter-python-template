# SBOM & Security Scan - Calls Org-Level Reusable Workflow
# This is a lightweight caller workflow that invokes the organization's
# shared SBOM generation and security scanning workflow.
#
# Features:
#   - CycloneDX SBOM generation
#   - Trivy vulnerability scanning
#   - License compliance checking
#   - SBOM/artifact results published as downloadable build artifacts. The
#     upstream python-sbom.yml reusable workflow also attempts a SARIF
#     upload to the GitHub Security tab for its Trivy runtime-deps scan;
#     GitHub Advanced Security (Code Security) requires a paid plan and is
#     not assumed to be enabled on projects generated from this template, so
#     that upload will be a no-op unless the downstream project enables it.
{%- if cookiecutter.include_github_actions == "yes" %}
name: SBOM & Security Scan

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sbom.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    # Weekly scan every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

{% if cookiecutter.include_supply_chain_security == "yes" -%}
env:
  INFISICAL_DOMAIN: {{ cookiecutter.infisical_domain }}
{% endif -%}

jobs:
  sbom:
    name: SBOM & Security
    uses: {{ cookiecutter.github_org_or_user }}/.github/.github/workflows/python-sbom.yml@main
    with:
      python-version: '{{ cookiecutter.python_version }}'
      fail-on-vulnerabilities: true
      severity-threshold: 'CRITICAL,HIGH'
      artifact-retention-days: 90
      fail-on-forbidden-licenses: false
    {%- if cookiecutter.include_supply_chain_security == "yes" %}
    secrets:
      INFISICAL_CLIENT_ID: {% raw %}${{ secrets.INFISICAL_CLIENT_ID }}{% endraw %}
      INFISICAL_CLIENT_SECRET: {% raw %}${{ secrets.INFISICAL_CLIENT_SECRET }}{% endraw %}
    {%- endif %}
{%- else %}
# GitHub Actions disabled for this project
# Enable include_github_actions to use SBOM generation and security scanning
{%- endif %}
