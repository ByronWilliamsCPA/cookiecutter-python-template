[project]
name = "cookiecutter-python-template"
version = "0.1.0"
description = "Modern Python cookiecutter template with UV, Ruff, and best practices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Byron Williams", email = "byron@example.com"},
]
keywords = ["cookiecutter", "template", "python", "uv", "ruff", "best-practices"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
dev = [
    # Code quality
    "pre-commit>=3.5.0",
    "ruff>=0.14.6",
    "basedpyright>=1.35.0",

    # Security
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",

    # Template tools
    "cookiecutter>=2.5.0",
    "cruft>=2.15.0",

    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest-randomly>=3.15.0",
    "pytest-xdist>=3.5.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Template repository - ship hooks directory
packages = ["hooks"]

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.ruff]
line-length = 88
# py312 intentional: hooks only run on Python 3.12+; requires-python covers the
# generated project's broader >=3.10 support range, not the hook runtime.
target-version = "py312"
src = ["hooks"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "EM",     # flake8-errmsg
    "FA",     # flake8-future-annotations
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "T10",    # flake8-debugger
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "YTT",    # flake8-2020
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 100
max-branches = 12
max-args = 4

[tool.ruff.lint.per-file-ignores]
"hooks/*" = [
    "T201",    # Allow print statements in hooks
    "PLR0913", # Allow more args in hooks where needed
    "S603",    # subprocess call: legitimate in template generation hooks
    "PLR0133", # Two constants compared: false positive on Jinja2 template strings
]
"tests/*" = [
    "S101",    # Allow assert in tests
    "SLF001",  # Allow private member access in tests
    "ANN",     # No annotations required in tests
]

[tool.ruff.lint.isort]
known-first-party = []
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
# Hooks contain Jinja2 template strings (e.g. "{{ cookiecutter.include_cli }}")
# that are always string literals at analysis time, never equal to "yes"/"no".
# This is the same false-positive that PLR0133 is already suppressed for in ruff.
reportUnnecessaryComparison = "none"
include = ["hooks"]
exclude = [
    "{{cookiecutter.project_slug}}",
    "{{ cookiecutter.repo_name }}",
    ".venv",
    "tests",
]

[tool.bandit]
targets = ["hooks"]
exclude_dirs = [
    "{{cookiecutter.project_slug}}",
    "{{ cookiecutter.repo_name }}",
    ".venv",
    "tests",
]
# Skip subprocess-related checks - acceptable in template generation hooks
# Skip B101 (assert_used) - test files use assert legitimately for pytest
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
# Coverage disabled for template repo - hooks only execute during cookiecutter generation
# Generated projects will have their own coverage requirements
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["hooks"]
omit = [
    "tests/*",
    "{{cookiecutter.project_slug}}/*",
    "{{ cookiecutter.repo_name }}/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# fail_under omitted: hooks execute via cookiecutter, not pytest, so coverage
# is always 0% in this repo. The generated projects enforce their own threshold.
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "interrogate>=1.7.0",
    "pydoclint>=0.8.4",
]

# Pydoclint Configuration (Docstring Argument Validation)
# Validates that docstring arguments match function signatures
# Reference: https://github.com/jsh9/pydoclint
[tool.pydoclint]
style = "google"
exclude = '\.git|tests/|scripts/|benchmarks/|tools/|noxfile\.py|\.claude/'
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
skip-checking-raises = false
require-return-section-when-returning-nothing = false
require-return-section-when-returning-values = false
require-yield-section-when-yielding-values = false
