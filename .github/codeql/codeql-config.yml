# CodeQL configuration for cookiecutter-python-template.
#
# Files under `hooks/` are Python cookiecutter pre/post-generation hooks
# rendered by Jinja2 BEFORE execution. Lines such as
# `if "{{ cookiecutter.include_editorconfig }}" == "no":` look like
# "comparison of constants" or "constant in conditional" to a static analyzer
# that reads the file as plain Python, but at runtime the left-hand side is
# substituted with the value the project author chose ("yes" or "no") and the
# comparison is meaningful. CodeQL has no awareness of cookiecutter templating,
# so the queries below are filtered out for the `hooks/` path only.
#
# The same suppression scope intentionally does NOT cover
# `{{cookiecutter.project_slug}}/`, because the generated project's Python is
# executed as-is after rendering and benefits from full CodeQL coverage.

name: "Custom CodeQL config for cookiecutter hooks"

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  - exclude:
      id: py/constant-comparison
      paths:
        - hooks/**
  - exclude:
      id: py/constant-conditional-expression
      paths:
        - hooks/**
  - exclude:
      id: py/comparison-of-constants
      paths:
        - hooks/**
