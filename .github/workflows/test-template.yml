name: Test Template

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Test hook files with pytest
  test-hooks:
    name: Test Hook Files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run hook unit tests
        run: |
          uv run pytest tests/unit/test_hooks.py -v

  # Test template generation with various configs
  test-generation:
    name: Test Generation (${{ matrix.config }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        config: [minimal, cli-app, api-service, ml-project, full-featured]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run generation tests for ${{ matrix.config }}
        # Use the explicit parametrized id so a real failure is reported as a
        # real failure. The previous ` || ` fallback hid genuine failures by
        # falling through to a second pytest invocation that almost always passed.
        run: |
          uv run pytest tests/unit/test_generation.py::TestConfigurationVariations::test_predefined_configs[${{ matrix.config }}] -v

  # Comprehensive integration tests
  test-integration:
    name: Integration Tests (${{ matrix.config }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config: [minimal, cli-app, api-service, ml-project]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev build-essential

      - name: Install testing dependencies
        run: |
          uv sync --all-extras
          # Install additional tools for validation
          pip install cookiecutter pre-commit yamllint tomli ruff basedpyright

      - name: Test feature combination
        run: |
          ./scripts/test-feature-combination.sh --config ${{ matrix.config }} --keep

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ -v -m integration

  # Test quality tool integrations
  test-quality-tools:
    name: Test Quality Tools
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras
          pip install cookiecutter

      - name: Test QLTY integration
        run: |
          uv run pytest tests/quality_tools/test_qlty.py -v

      - name: Test SonarCloud integration
        run: |
          uv run pytest tests/quality_tools/test_sonarcloud.py -v

  # Validate generated project CI workflows
  validate-generated-ci:
    name: Validate Generated CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        config: [minimal, cli-app]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install cookiecutter pre-commit ruff

      - name: Generate project
        run: |
          cookiecutter . --no-input --config-file tests/fixtures/configs/${{ matrix.config }}.json --output-dir /tmp/test-output

      - name: Get project directory
        id: project
        run: |
          PROJECT_SLUG=$(python -c "import json; print(json.load(open('tests/fixtures/configs/${{ matrix.config }}.json'))['default_context']['project_slug'])")
          echo "dir=/tmp/test-output/$PROJECT_SLUG" >> $GITHUB_OUTPUT

      - name: Validate generated project
        run: |
          ./scripts/validate-generated-project.sh ${{ steps.project.outputs.dir }}

      - name: Install project dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          pip install uv
          uv sync --all-extras

      - name: Run Ruff linting on generated project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          uv run ruff check . --no-fix

      - name: Run Ruff format check on generated project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          uv run ruff format --check .

      - name: Run BasedPyright on generated project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          uv run basedpyright src/

      - name: Run pre-commit on generated project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f ".pre-commit-config.yaml" ]; then
            pre-commit run --all-files || echo "Pre-commit found issues (may be expected)"
          fi

  # Test content validation
  test-content:
    name: Test Generated Content
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras
          pip install cookiecutter tomli

      - name: Run content validation tests
        run: |
          uv run pytest tests/test_generated_content.py -v

  # Overall test summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test-hooks, test-generation, test-integration, test-quality-tools, validate-generated-ci, test-content]
    if: always()

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - name: Check test results
        run: |
          if [ "${{ needs.test-hooks.result }}" != "success" ] || \
             [ "${{ needs.test-generation.result }}" != "success" ] || \
             [ "${{ needs.test-integration.result }}" != "success" ] || \
             [ "${{ needs.test-quality-tools.result }}" != "success" ] || \
             [ "${{ needs.validate-generated-ci.result }}" != "success" ] || \
             [ "${{ needs.test-content.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
