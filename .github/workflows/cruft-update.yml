# Cruft Template Update Workflow
# Automatically checks for and applies template updates to registered repositories.
#
# This workflow runs on a schedule and creates PRs when template updates are available.
#
# SPDX-FileCopyrightText: 2025 Byron Williams
# SPDX-License-Identifier: MIT
#
# This workflow runs in the cookiecutter-python-template repo to update all child projects.
name: Cruft Template Updates

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check for updates without applying them'
        required: false
        default: 'false'
        type: boolean
      repository:
        description: 'Specific repository to update (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    name: Check for Template Updates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv pip install --system cruft pyyaml

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run cruft check (dry run)
        if: ${{ inputs.dry_run == 'true' || github.event_name == 'schedule' }}
        run: |
          python tools/cruft-manager/cruft_manager.py \
            --registry tools/cruft-manager/cruft_registry.yaml \
            --dry-run \
            --report cruft-report.md \
            --verbose

      - name: Upload dry run report
        if: ${{ inputs.dry_run == 'true' || github.event_name == 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cruft-update-report
          path: cruft-report.md
          retention-days: 7

  apply-updates:
    name: Apply Template Updates
    runs-on: ubuntu-latest
    needs: check-updates
    if: ${{ inputs.dry_run != 'true' && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv pip install --system cruft pyyaml

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply cruft updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/cruft-manager/cruft_manager.py \
            --registry tools/cruft-manager/cruft_registry.yaml \
            --report cruft-update-results.md \
            --verbose

      - name: Upload update results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cruft-update-results
          path: cruft-update-results.md
          retention-days: 30

      - name: Create summary issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = 'Update failed - see workflow logs for details';
            try {
              report = fs.readFileSync('cruft-update-results.md', 'utf8');
            } catch (e) {}

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Cruft Template Update Failed',
              body: `## Template Update Failure\n\n${report}\n\n[Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'cruft']
            });
