# SonarCloud Analysis - Cookiecutter Python Template
# Thin caller for the organization's reusable SonarCloud workflow.
#
# The reusable workflow uses sonarqube-scan-action v7.2.0, which resolves
# the /analysis/analyses 404 bug encountered with v4.x on new projects.
#
# SonarCloud Dashboard: https://sonarcloud.io/project/overview?id=ByronWilliamsCPA_cookiecutter-python-template
name: SonarCloud

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    permissions:
      contents: read
      pull-requests: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@961eb17d8e9b7fe0d8bfc5dbe9d23c824484fb11  # main
    with:
      sonar-organization: 'byronwilliamscpa'
      sonar-project-key: 'ByronWilliamsCPA_cookiecutter-python-template'
      python-version: '3.12'
      source-directory: 'hooks'
      coverage-paths: 'coverage.xml'
      fail-on-quality-gate: ${{ github.event_name != 'pull_request' }}
      skip-if-no-token: true
      no-build: false  # this repo is itself an installable package (hatchling backend); upstream default of true would block 'uv sync' from installing the editable project
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
