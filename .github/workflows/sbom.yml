# SBOM & Security Scan - Calls Org-Level Reusable Workflow
# This is a lightweight caller workflow that invokes the organization's
# shared SBOM generation and security scanning workflow.
#
# Features:
#   - CycloneDX SBOM generation
#   - Trivy vulnerability scanning
#   - License compliance checking
#   - SBOM/artifact results published as downloadable build artifacts. The
#     upstream python-sbom.yml reusable workflow also attempts a SARIF
#     upload to the GitHub Security tab for its Trivy runtime-deps scan;
#     that upload is a no-op on this repo since GitHub Advanced Security
#     (Code Security) is not enabled, and updating it is out of scope here
#     (owned by ByronWilliamsCPA/.github). That scan has no artifact
#     fallback at the currently pinned SHA, so its findings currently go
#     nowhere; flagged as a follow-up.
name: SBOM & Security Scan

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sbom.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    # Weekly scan every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    name: SBOM & Security
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sbom.yml@961eb17d8e9b7fe0d8bfc5dbe9d23c824484fb11  # main
    with:
      python-version: '3.12'
      no-build: false  # this repo is itself an installable package (hatchling backend); upstream default of true would block 'uv sync' from installing the editable project
      fail-on-vulnerabilities: true
      severity-threshold: 'CRITICAL,HIGH'
      artifact-retention-days: 90
      fail-on-forbidden-licenses: false
